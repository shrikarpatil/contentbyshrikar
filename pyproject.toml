[project]
name = "influencerai"
version = "0.1.0"
description = "A lightweight AI-assisted short-form video production pipeline"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openai>=3.6.0",
    "openai-agents>=0.22.0",
    "pydantic>=2.11.0",
    "python-dotenv>=1.0.1",
    "Pillow>=11.3.0",
    "imageio-ffmpeg>=0.6.0",
    "pywin32>=312; sys_platform == 'win32'",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "google-auth-httplib2>=0.4.4",
]

[project.optional-dependencies]
transcription = ["faster-whisper>=1.2.0"]

[project.scripts]
influencerai = "influencerai.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
